<!DOCTYPE html>
<html lang="en">
<head>

  <title>Sunflowers</title>

</head>
<body>

      <div class="table"></div>
      <div class="vase"></div>

      <div class="leaf dark l1"></div>
      <div class="leaf mid l2"></div>
      <div class="leaf dark l3"></div>
      <div class="leaf dark l4"></div>
      <div class="leaf mid l5"></div>
      <div class="leaf dark l6"></div>
      <div class="leaf dark l7"></div>
      <div class="leaf mid l8"></div>
      <div class="leaf mid l9"></div>
      <div class="leaf dark l10"></div>
      <div class="leaf teal l11"></div>
      <div class="leaf mid l12"></div>
      <div class="leaf dark l13"></div>
      <div class="leaf teal l14"></div>

      <div class="flower f1"></div>
      <div class="flower f2"></div>
      <div class="flower f3"></div>
      <div class="flower f4"></div>
      <div class="flower f5"></div>
      <div class="flower f6"></div>
      <div class="flower f7"></div>
    </div>
  </div>

</html>
