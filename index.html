<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sunflowers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="canvas">
    <!-- wall: three flat blocks of color -->
    <div class="wall w1"></div>
    <div class="wall w2"></div>
    <div class="wall w3"></div>

    <!-- table -->
    <div class="table"></div>
    <div class="patch p1"></div>
    <div class="patch p2"></div>
    <div class="patch p3"></div>
    <div class="shadow"></div>

    <!-- vase -->
    <div class="vase"></div>

    <!-- leaves behind the flowers -->
    <div class="leaf dark b1"></div>
    <div class="leaf mid b2"></div>
    <div class="leaf dark b3"></div>
    <div class="leaf mid b4"></div>
    <div class="leaf dark b5"></div>
    <div class="leaf mid b6"></div>
    <div class="leaf light b7"></div>
    <div class="leaf light b8"></div>

    <!-- sunflowers -->
    <div class="flower f1 gold"><i></i></div>
    <div class="flower f2 gold"><i></i></div>
    <div class="flower f3 orange"><i></i></div>
    <div class="flower f4 gold"><i></i></div>
    <div class="flower f5 gold"><i></i></div>
    <div class="flower f6 gold"><i></i></div>
    <div class="flower f7 orange"><i></i></div>
    <div class="flower f8 gold"><i></i></div>
    <div class="flower f9 orange"><i></i></div>

    <!-- leaves hanging in front -->
    <div class="leaf dark d1"></div>
    <div class="leaf mid d2"></div>
    <div class="leaf light d3"></div>
    <div class="leaf dark d4"></div>
    <div class="leaf mid d5"></div>
    <div class="leaf light d6"></div>
  </div>
</body>
</html>
